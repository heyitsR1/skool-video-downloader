name = "skool-dl-license"
main = "index.js"
compatibility_date = "2024-09-23"

# Secret FREEMIUS_SECRET_KEY (the Skool Video Downloader product's secret key,
# Freemius product 33457 — NOT the Whop product's key) is set via:
#   wrangler secret put FREEMIUS_SECRET_KEY
# Never put the real key in this file.
#
# Dodo Payments needs NO key here: /licenses/activate and /licenses/validate are
# public endpoints. Every Dodo call that requires the secret (cancellation,
# win-back checkout sessions) lives in the shared whop-dl-license Worker instead,
# so this Worker — the one on the hot path for every install — holds no way to
# move money.
#
# DODO_MODE is unset on purpose, which means LIVE (see resolveDodo). To run a
# test-mode purchase end to end, uncomment the block below, deploy, test, then
# comment it out again and redeploy — as was done for the 2026-07-25 E2E.
#
#   [vars]
#   DODO_MODE = "test"
#
# Never leave test mode on in production: this repo is public, so the test
# product ids are public, and a test-mode checkout would mint free Pro licences.

# Run `npm test` in this directory before deploying — it covers the two-provider
# activation ordering and the never-revoke-on-an-outage guarantee.
